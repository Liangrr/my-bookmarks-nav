<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的收藏夹 - 精选网站导航</title>
<meta name="description" content="个人收藏的优质网站导航：影视、开发、设计、实用工具一站式收录">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔖</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap">
<style>
/* ========== 设计系统 Token ========== */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-card-hover: rgba(255, 255, 255, 0.08);
  --bg-glass: rgba(255, 255, 255, 0.06);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.16);
  --text-primary: #f0f0f5;
  --text-secondary: #9a9aae;
  --text-tertiary: #6b6b80;
  --accent: #8b5cf6;
  --accent-light: #a78bfa;
  --accent-glow: rgba(139, 92, 246, 0.25);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.2);
  --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.35);
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg-primary: #f8f9fc;
  --bg-secondary: #ffffff;
  --bg-card: rgba(0, 0, 0, 0.03);
  --bg-card-hover: rgba(0, 0, 0, 0.06);
  --bg-glass: rgba(255, 255, 255, 0.75);
  --border: rgba(0, 0, 0, 0.08);
  --border-hover: rgba(0, 0, 0, 0.16);
  --text-primary: #1a1a2e;
  --text-secondary: #5a5a70;
  --text-tertiary: #9a9aae;
  --accent-glow: rgba(139, 92, 246, 0.15);
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06);
  --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh;
}

/* ========== 背景装饰 ========== */
.bg-glow {
  position: fixed;
  top: -10%;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 600px;
  background: radial-gradient(ellipse at center, var(--accent-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  filter: blur(60px);
}

/* ========== 导航栏 ========== */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 700;
}

.nav-logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), #3b82f6);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-logo-icon svg { width: 18px; height: 18px; fill: white; }

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.theme-toggle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  color: var(--text-secondary);
}

.theme-toggle:hover { background: var(--bg-card-hover); transform: rotate(15deg); }
.theme-toggle svg { width: 18px; height: 18px; }

/* ========== 主容器 ========== */
.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 32px 80px;
  position: relative;
  z-index: 1;
}

/* ========== Hero 区 ========== */
.hero {
  text-align: center;
  margin-bottom: 32px;
  padding-top: 20px;
}

.hero h1 {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero p {
  color: var(--text-secondary);
  font-size: 16px;
  max-width: 500px;
  margin: 0 auto;
}

/* ========== 搜索栏 ========== */
.search-bar {
  max-width: 640px;
  margin: 28px auto 32px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 15px 24px 15px 52px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
  transition: var(--transition);
  font-family: inherit;
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow);
}

.search-input::placeholder { color: var(--text-tertiary); }

.search-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}

.search-icon svg { width: 18px; height: 18px; }

/* ========== 分类标签 ========== */
.category-tabs {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 36px;
}

.tab {
  padding: 8px 18px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  font-family: inherit;
}

.tab:hover { background: var(--bg-card-hover); color: var(--text-primary); }

.tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 4px 16px var(--accent-glow);
}

/* ========== Bento Grid 布局 ========== */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 130px;
  gap: 16px;
}

.bookmark-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}

.bookmark-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--card-accent, var(--accent));
  opacity: 0;
  transition: var(--transition);
}

.bookmark-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

.bookmark-card:hover::before { opacity: 1; }

/* Bento 大小变体 */
.card-large { grid-column: span 2; grid-row: span 2; }
.card-wide { grid-column: span 2; }
.card-tall { grid-row: span 2; }

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.card-icon {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 20px;
  font-weight: 700;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
}

.card-url {
  font-size: 12px;
  color: var(--text-tertiary);
}

.card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-top: 10px;
}

.card-tag {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 100px;
  background: var(--bg-glass);
  color: var(--text-tertiary);
}

/* 分类颜色 */
.cat-video .card-icon { background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(236, 72, 153, 0.08)); }
.cat-video { --card-accent: #ec4899; }
.cat-video .card-icon { color: #ec4899; }

.cat-dev .card-icon { background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.08)); }
.cat-dev { --card-accent: #3b82f6; }
.cat-dev .card-icon { color: #3b82f6; }

.cat-design .card-icon { background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.08)); }
.cat-design { --card-accent: #8b5cf6; }
.cat-design .card-icon { color: #8b5cf6; }

.cat-tool .card-icon { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.08)); }
.cat-tool { --card-accent: #10b981; }
.cat-tool .card-icon { color: #10b981; }

.cat-other .card-icon { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.08)); }
.cat-other { --card-accent: #f59e0b; }
.cat-other .card-icon { color: #f59e0b; }

/* ========== 无结果状态 ========== */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
  display: none;
}

.no-results.show { display: block; }

.no-results-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

/* ========== 统计栏 ========== */
.stats-bar {
  text-align: center;
  margin-bottom: 24px;
  font-size: 13px;
  color: var(--text-tertiary);
}

/* ========== 页脚 ========== */
.footer {
  text-align: center;
  padding: 32px;
  color: var(--text-tertiary);
  font-size: 13px;
  border-top: 1px solid var(--border);
  margin-top: 60px;
}

.footer a { color: var(--text-secondary); text-decoration: none; }
.footer a:hover { color: var(--accent); }

/* ========== 响应式 ========== */
@media (max-width: 1024px) {
  .bento-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 768px) {
  .bento-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 120px; }
  .card-large { grid-column: span 2; }
  .hero h1 { font-size: 32px; }
  .container { padding: 24px 16px 60px; }
  .nav-bar { padding: 12px 16px; }
  .search-input { font-size: 16px; }
}

@media (max-width: 480px) {
  .bento-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .card-large, .card-wide, .card-tall { grid-column: span 1; grid-row: span 1; }
  .hero h1 { font-size: 28px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- 导航栏 -->
<nav class="nav-bar">
  <div class="nav-logo">
    <div class="nav-logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <span>我的收藏夹</span>
  </div>
  <div class="nav-actions">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<div class="container">
  <!-- Hero 区 -->
  <div class="hero">
    <h1>Asuria精选网站收藏</h1>
    <p>影视、开发、设计、实用工具 —— 日常在用的优质网站，都在这里</p>
  </div>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索网站名称或关键词..." oninput="render()">
  </div>

  <!-- 分类标签 -->
  <div class="category-tabs" id="categoryTabs">
    <!-- 动态生成 -->
  </div>

  <!-- 统计 -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Bento Grid 书签卡片 -->
  <div class="bento-grid" id="bookmarkGrid"></div>

  <!-- 无结果 -->
  <div class="no-results" id="noResults">
    <div class="no-results-icon">🔍</div>
    <p style="font-size: 16px; font-weight: 500;">没有找到匹配的网站</p>
    <p style="font-size: 14px; margin-top: 8px;">试试其他关键词吧</p>
  </div>
</div>

<!-- 页脚 -->
<footer class="footer">
  我的收藏夹 · 个人网站导航 · Powered by Vercel
</footer>

<script>
// ==========================================
//  书签数据 - 修改这里即可增删网站
// ==========================================
const categories = [
  { id: 'all', name: '全部' },
  { id: 'video', name: '影视娱乐' },
  { id: 'dev', name: '开发工具' },
  { id: 'design', name: '设计灵感' },
  { id: 'tool', name: '实用工具' },
  { id: 'other', name: '其他' }
];

const bookmarks = [
  // 影视娱乐
  { title: 'Netflix', url: 'netflix.com', desc: '全球流媒体巨头，海量电影剧集，4K 画质，原创内容质量极高', category: 'video', icon: 'N', size: 'large' },
  { title: '哔哩哔哩', url: 'bilibili.com', desc: '国内最大年轻人文化社区，番剧、纪录片、知识区内容丰富', category: 'video', icon: 'B', size: 'wide' },
  { title: 'YouTube', url: 'youtube.com', desc: '全球最大视频平台', category: 'video', icon: 'Y' },
  { title: '豆瓣电影', url: 'movie.douban.com', desc: '电影评分与影评参考', category: 'video', icon: 'D' },

  // 开发工具
  { title: 'GitHub', url: 'github.com', desc: '全球最大代码托管平台，开源项目聚集地，Trending 每天都有新宝藏', category: 'dev', icon: 'G', size: 'large' },
  { title: 'GitHub Trending', url: 'github.com/trending', desc: '每日/每周热门开源项目榜单，发现新工具新框架的最佳入口', category: 'dev', icon: 'T', size: 'wide' },
  { title: 'Stack Overflow', url: 'stackoverflow.com', desc: '程序员问答社区，技术问题解答', category: 'dev', icon: 'S' },
  { title: 'V2EX', url: 'v2ex.com', desc: '创意工作者社区，程序员日常交流', category: 'dev', icon: 'V' },

  // 设计灵感
  { title: 'Dribbble', url: 'dribbble.com', desc: '全球设计师作品展示社区，UI/UX、插画、品牌设计灵感宝库', category: 'design', icon: 'Dr', size: 'tall' },
  { title: 'Behance', url: 'behance.net', desc: 'Adobe 旗下作品集平台，专业设计作品展示', category: 'design', icon: 'Be' },
  { title: 'Figma', url: 'figma.com', desc: '在线协作设计工具，组件库系统完善', category: 'design', icon: 'Fi' },
  { title: 'Mobbin', url: 'mobbin.com', desc: '移动端 UI 模式库，千万级截图参考', category: 'design', icon: 'M' },

  // 实用工具
  { title: 'Notion', url: 'notion.so', desc: '全能笔记与知识库工具，文档、数据库、项目管理一站搞定', category: 'tool', icon: 'Nt', size: 'wide' },
  { title: 'TinyPNG', url: 'tinypng.com', desc: '图片压缩工具，PNG/JPG 智能压缩', category: 'tool', icon: 'TP' },
  { title: 'Canva', url: 'canva.com', desc: '在线平面设计，模板丰富易上手', category: 'tool', icon: 'Ca' },

  // 其他
  { title: '少数派', url: 'sspai.com', desc: '高品质数字消费指南与效率工具分享，发现好用的 App 和工作流', category: 'other', icon: '少', size: 'wide' },
  { title: '知乎', url: 'zhihu.com', desc: '中文问答社区，知识分享', category: 'other', icon: '知' },
  { title: '微博', url: 'weibo.com', desc: '社交媒体热点资讯', category: 'other', icon: '微' }
];

// ==========================================
//  渲染逻辑
// ==========================================
let currentCategory = 'all';

// 初始化分类标签
function renderTabs() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = categories.map(cat =>
    `<button class="tab ${cat.id === currentCategory ? 'active' : ''}" onclick="setCategory('${cat.id}')">${cat.name}</button>`
  ).join('');
}

function setCategory(cat) {
  currentCategory = cat;
  renderTabs();
  render();
}

// 渲染书签卡片
function render() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const grid = document.getElementById('bookmarkGrid');
  const noResults = document.getElementById('noResults');
  const statsBar = document.getElementById('statsBar');

  let filtered = bookmarks.filter(b => {
    const matchCat = currentCategory === 'all' || b.category === currentCategory;
    const matchSearch = !query ||
      b.title.toLowerCase().includes(query) ||
      b.url.toLowerCase().includes(query) ||
      b.desc.toLowerCase().includes(query);
    return matchCat && matchSearch;
  });

  statsBar.textContent = `共 ${filtered.length} 个网站`;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResults.classList.add('show');
    return;
  }
  noResults.classList.remove('show');

  grid.innerHTML = filtered.map(b => {
    const sizeClass = b.size ? `card-${b.size}` : '';
    const catName = categories.find(c => c.id === b.category)?.name || '';
    return `
      <a href="https://${b.url}" target="_blank" rel="noopener" class="bookmark-card card-${b.category} ${sizeClass}">
        <span class="card-tag">${catName}</span>
        <div class="card-header">
          <div class="card-icon">${b.icon}</div>
          <div>
            <div class="card-title">${b.title}</div>
            <div class="card-url">${b.url}</div>
          </div>
        </div>
        <div class="card-desc">${b.desc}</div>
      </a>
    `;
  }).join('');
}

// 主题切换
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('nav-theme', next);
  updateThemeIcons(next);
}

function updateThemeIcons(theme) {
  document.querySelector('.icon-sun').style.display = theme === 'light' ? 'none' : 'block';
  document.querySelector('.icon-moon').style.display = theme === 'light' ? 'block' : 'none';
}

// 初始化
(function init() {
  const saved = localStorage.getItem('nav-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcons(saved);
  renderTabs();
  render();
})();
</script>

</body>
</html>
